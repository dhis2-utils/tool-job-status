# These hoists are needed for @dhis2/app-shell since it uses directly some libraries that were hoisted by yarn 1
# This is a better alternative than pnpm's shamefullyHoist https://pnpm.io/settings#shamefullyhoist until we update the way that @dhis2/app-shell works
publicHoistPattern:
    - '@dhis2/ui'
    - 'typeface-roboto'
    - '@dhis2/app-adapter'
    - 'prop-types'
    - '@dhis2/d2-i18n'
    - 'post-robot'
    - 'styled-jsx'
    - '@dhis2/app-adapter'
    - '@dhis2/pwa'
    # @dhis2/cli-app-scripts references these two Babel plugins by bare name in
    # its jest babel config, so Babel resolves them from the project root.
    - '@babel/plugin-transform-private-methods'
    - '@babel/plugin-transform-private-property-in-object'

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild
